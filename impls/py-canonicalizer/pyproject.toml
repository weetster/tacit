[project]
name = "tacit-canon"
version = "0.1.0"
description = "First canonicalizer for Tacit-Lite canonical text format (Python reference)"
requires-python = ">=3.14"
dependencies = [
    "blake3>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tacit_canon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
