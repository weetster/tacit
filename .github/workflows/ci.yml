name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  py-canonicalizer:
    name: py-canonicalizer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impls/py-canonicalizer
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

  rs-canonicalizer:
    name: rs-canonicalizer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impls/rs-canonicalizer
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            impls/rs-canonicalizer/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('impls/rs-canonicalizer/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test
