name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  py-canonicalizer:
    name: py-canonicalizer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impls/py-canonicalizer
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

  tacit-canonical:
    name: tacit-canonical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 19
        run: sudo apt-get install -y llvm-19-dev libpolly-19-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --features tacit-codegen/llvm19-1,tacit-cli/llvm19-1 -- -D warnings

      - name: Run tests
        run: cargo test --features tacit-codegen/llvm19-1,tacit-cli/llvm19-1

      - name: Build tacit CLI
        run: cargo build --features tacit-cli/llvm19-1 --bin tacit

      - name: Smoke-test tacit CLI (compile + check + view)
        run: |
          ./target/debug/tacit compile examples/smoke/hello.tac -o /tmp/tacit-hello
          output=$(/tmp/tacit-hello)
          test "$output" = "hello, world"
          ./target/debug/tacit check examples/smoke/echo.tac
          ./target/debug/tacit check examples/smoke/hello.tac --format json
          ./target/debug/tacit view examples/smoke/hello.tac --as authoring > /dev/null
          ./target/debug/tacit view examples/smoke/hello.tac --as inspection > /dev/null

      - name: Round-trip stability (canonical → authoring → canonical)
        run: cargo test -p tacit-views --test round_trip_stability

      - name: Phase 3 carry-over programs (compile + check)
        run: |
          ./target/debug/tacit check examples/phase-3/sort.tac
          ./target/debug/tacit check examples/phase-3/list.tac
          ./target/debug/tacit check examples/phase-3/sum-numbers.tac
          ./target/debug/tacit compile examples/phase-3/sort.tac -o /tmp/tacit-sort
          output=$(/tmp/tacit-sort)
          test "$output" = "$(printf '1\n2\n3\n4\n5')"
          ./target/debug/tacit compile examples/phase-3/list.tac -o /tmp/tacit-list
          /tmp/tacit-list; test $? -eq 15
          ./target/debug/tacit compile examples/phase-3/sum-numbers.tac -o /tmp/tacit-sum-numbers
          output=$(printf '1\n2\n3\n' | /tmp/tacit-sum-numbers)
          test "$output" = "6"

      - name: Phase 6 Stage 11 embedding demo
        run: |
          # Package-level tests for the kernel run via the CLI.
          ./target/debug/tacit test examples/phase-6/embedding-demo/kernel --format json > /tmp/embedding-demo-test.json
          test "$(jq -r .outcome /tmp/embedding-demo-test.json)" = "pass"
          # Interface + linkable library.
          ./target/debug/tacit interface examples/phase-6/embedding-demo/kernel --emit-library > /tmp/embedding-demo-interface.txt
          grep -q interface.json /tmp/embedding-demo-interface.txt
          grep -q tacit_host.h /tmp/embedding-demo-interface.txt
          grep -q libtacit_p_ /tmp/embedding-demo-interface.txt
          # End-to-end demo: link the static lib into a Rust host that satisfies
          # the host import callback and calls each public export. The host crate
          # pins the llvm19-1 feature itself, so no extra --features here.
          cargo run -p tacit-embedding-demo-host > /tmp/embedding-demo.out
          grep -q "decode_op(0xAB) = 11" /tmp/embedding-demo.out
          grep -q "cpu program ran to acc = 40" /tmp/embedding-demo.out
          grep -q "host_log: \[40\]" /tmp/embedding-demo.out
          grep -q "^ok" /tmp/embedding-demo.out

  corpus:
    name: corpus
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corpus/harness
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 19
        run: sudo apt-get install -y llvm-19-dev libpolly-19-dev

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build tacit CLI
        run: cargo build --manifest-path ../../Cargo.toml --features tacit-cli/llvm19-1 --bin tacit

      - name: Verify sealed manifest
        run: uv run corpus-verify-sealed

      - name: Run open corpus tasks
        run: uv run corpus-run

      - name: Run open Tacit references
        run: uv run corpus-run-tacit

      - name: Dry-run Phase 3 eval harness
        run: uv run corpus-eval --dry-run
