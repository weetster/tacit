[package]
name = "tacit-typecheck"
version = "0.1.0"
edition = "2021"
description = "Phase 2 type and effect checker for Tacit-Lite"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
tacit-canonical = { path = "../tacit-canonical" }
tacit-views = { path = "../tacit-views" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
