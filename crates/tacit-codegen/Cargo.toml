[package]
name = "tacit-codegen"
version = "0.1.0"
edition = "2021"
description = "Phase 1 LLVM IR emitter for Tacit-Lite"
license = "MIT OR Apache-2.0"
publish = false

# `inkwell` is gated behind feature flags so the AST-analysis layer of
# this crate compiles and tests without an installed LLVM. Pick a
# feature when building the IR emitter:
#
#   cargo build --features llvm19-1   # LLVM 19 (pinned; Debian bookworm apt / macOS brew bottle)
#   cargo build --features llvm18-1   # LLVM 18 (older Linux apt)
#   cargo build --features llvm15-0   # LLVM 15 (last x86_64 macOS prebuilt on llvm.org)
#
# Pinned version: LLVM 19 (llvm19-1). See docs/compiler-architecture.md.
[dependencies]
tacit-canonical = { path = "../tacit-canonical" }
tacit-typecheck = { path = "../tacit-typecheck" }
inkwell = { version = "0.9", optional = true, default-features = false }
thiserror = "1"

[features]
default = []
# Convenience aggregate feature — a build that wants the IR emitter
# turns on exactly one of the version features below; `llvm` itself is
# not directly buildable.
llvm = []
# Per-version feature flags. Each enables `inkwell` with the matching
# LLVM bindings. Pick one.
llvm15-0 = ["dep:inkwell", "inkwell/llvm15-0", "llvm"]
llvm16-0 = ["dep:inkwell", "inkwell/llvm16-0", "llvm"]
llvm17-0 = ["dep:inkwell", "inkwell/llvm17-0", "llvm"]
llvm18-1 = ["dep:inkwell", "inkwell/llvm18-1", "llvm"]
llvm19-1 = ["dep:inkwell", "inkwell/llvm19-1", "llvm"]

[dev-dependencies]
tacit-typecheck = { path = "../tacit-typecheck" }
tacit-views = { path = "../tacit-views" }
tempfile = "3"
