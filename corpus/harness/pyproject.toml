[project]
name = "tacit-corpus"
version = "0.1.0"
description = "Phase 3 evaluation corpus harness for Tacit-Lite"
requires-python = ">=3.12"
dependencies = [
    "tiktoken>=0.8",
    "blake3>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
corpus-run = "tacit_corpus.run:main"
corpus-run-tacit = "tacit_corpus.run_tacit:main"
corpus-tokens = "tacit_corpus.count_tokens:main"
corpus-verify-sealed = "tacit_corpus.verify_sealed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tacit_corpus"]
